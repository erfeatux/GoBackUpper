; Copy next to the invocation path (the symlink directory if applicable); adjust paths before using.
; For bin/gobackupper these resolve to <project>/backup-target.
; The target must already exist on a suitable Btrfs filesystem.
[target]
path=../backup-target
snapshots=../backup-target/Snapshots

; Replace /home/alice with your actual source root.
; Put a .backup.ini in each declared root.
[sources]
user=/home/alice
